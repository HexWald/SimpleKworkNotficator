name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          repo="repos/$GITHUB_REPOSITORY"
          tag_sha=$(gh api "$repo/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
          gh api "$repo/git/tags/$tag_sha" --jq .message > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$GITHUB_REF_NAME"
